name: Clojure runtime

# Intentional: lint only. Do not run native-image, JDK, or tests here.
# GitHub runners are not the delivery gate — a flaky host should not carry
# GraalVM weight. Local Nix builds the image and runs clojure -M:test.
# Do not grow this workflow.

on:
  push:
    branches: [main, 'feat/clojure-runtime']
    paths:
      - 'prime-agent-runtime-clj/**'
      - '.github/workflows/clojure-runtime.yml'
  pull_request:
    paths:
      - 'prime-agent-runtime-clj/**'
      - '.github/workflows/clojure-runtime.yml'
  workflow_dispatch:

concurrency:
  group: clojure-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prime-agent-runtime-clj
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup clj-kondo
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          # Binary. No JDK, no Clojure CLI, no native-image.
          clj-kondo: '2026.01.19'

      - name: clj-kondo
        run: clj-kondo --fail-level warning --lint src test
